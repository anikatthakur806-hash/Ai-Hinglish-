name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_VER=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}')
          echo "Detected full Java version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Failed to detect Java version from output."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VER"
          if [ -z "$MAJOR_VER" ]; then
            echo "ERROR: Failed to determine Java major version."
            exit 1
          fi
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer. Detected: $MAJOR_VER"
            exit 1
          fi
          echo "Java 17+ environment verified successfully (Major version: $MAJOR_VER)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking debug.keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug.keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Contents of app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK at $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac
          echo "Verified debug APK exists, is non-empty, and has .apk extension: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$ORIGINAL_APK" ] || [ ! -s "$ORIGINAL_APK" ]; then
            echo "ERROR: Original APK $ORIGINAL_APK is missing or empty."
            exit 1
          fi
          REPO_RAW="${{ github.repository }}"
          REPO_BASE=$(basename "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g')
          if [ -z "$REPO_BASE" ]; then
            REPO_BASE="android-app"
          fi
          RELEASE_FILENAME="${REPO_BASE}-debug-build-${{ github.run_number }}.apk"
          TEMP_RELEASE_DIR=$(mktemp -d -p "$RUNNER_TEMP" apk_asset_XXXXXX)
          COPIED_APK="$TEMP_RELEASE_DIR/$RELEASE_FILENAME"
          cp "$ORIGINAL_APK" "$COPIED_APK"
          if [ ! -f "$COPIED_APK" ] || [ ! -s "$COPIED_APK" ]; then
            echo "ERROR: Failed to copy release APK to $COPIED_APK"
            exit 1
          fi
          echo "Prepared release asset: $COPIED_APK"
          echo "asset_path=$COPIED_APK" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH not found or is empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset is not an APK: $ASSET_PATH"
              exit 1
              ;;
          esac
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** #${{ github.run_number }}
          - **Run Attempt:** #${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Asset Name:** \`$ASSET_FILENAME\`

          > **Note:**
          > - This APK is intended for testing and debugging.
          > - It is not a Play Store production release.
          > - It is signed using a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "Release created successfully with tag: $RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Build and Release Summary ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published to GitHub Releases:"
              echo "- **Release Page:** [$RELEASE_TAG]($RELEASE_URL)"
              echo "- **Direct Download:** Download \`$ASSET_FILENAME\` from the **Assets** section of the release page."
              echo "- **Actions Artifact:** The build artifact \`app-debug-apk\` is also preserved in the GitHub Actions summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK build and artifact upload succeeded."
            echo "The debug APK artifact 'app-debug-apk' is available for download from this workflow run."

            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "The debug APK was built successfully and is preserved as an Actions artifact:"
              echo "- **Artifact Name:** \`app-debug-apk\` (available under the Artifacts section of this run)."
              echo "- **Note:** GitHub Release creation did not complete, but the APK build succeeded and is safe to download from workflow artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
